<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cicatrices de Primus</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <script>
    (function () {
      function preload(href) {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.href = href;
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
      preload('/assets/images/common/hero.png');
      var bento = document.createElement('link');
      bento.rel = 'preload';
      bento.as = 'image';
      bento.href = '/assets/images/legacy/home-intro.png';
      document.head.appendChild(bento);
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/common/favicon-32x32.png">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
